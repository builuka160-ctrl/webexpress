<!DOCTYPE html>
<html lang="lv"><head><meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(160deg, #FFFFFF 0%, #F1F5F9 55%, #E2E8F0 100%);
  }
  body {
    width: 1200px; height: 630px; overflow: hidden; background: transparent;
    font-family: 'DejaVu Sans', 'Liberation Sans', system-ui, sans-serif;
    color: #0F172A;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 82px; position: relative;
  }
  .glow {
    position: absolute; top: -180px; right: -120px; width: 720px; height: 520px;
    background: rgba(148, 163, 184, .45); border-radius: 50%; filter: blur(130px);
  }
  .inner { position: relative; z-index: 1; }
  .brand {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 24px; font-weight: 700; letter-spacing: -.5px; margin-bottom: 26px;
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: #0F172A; }
  h1 {
    font-size: 52px; font-weight: 700; line-height: 1.12; letter-spacing: -1.4px;
    max-width: 1020px; margin-bottom: 22px;
  }
  h1 .muted {
    background: linear-gradient(95deg, #64748B, #94A3B8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  p { font-size: 23px; color: #475569; font-weight: 500; max-width: 900px; line-height: 1.45; }
  .row { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
  .chip {
    font-family: 'DejaVu Sans Mono', monospace; font-size: 17px; font-weight: 600;
    padding: 11px 20px; border-radius: 999px;
    background: rgba(255, 255, 255, .85); border: 1px solid #CBD5E1; color: #1E293B;
  }
  .chip.solid { background: #0F172A; border-color: #0F172A; color: #FFFFFF; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="inner">
    <div class="brand"><span class="dot"></span>WebExpress</div>
    <h1>Mājas lapas izstrāde<br><span class="muted">Создание сайтов под ключ</span></h1>
    <p>Demo 48 stundu laikā bez priekšapmaksas · Демо за 48 часов без предоплаты</p>
    <div class="row">
      <span class="chip solid">250 € — 550 €</span>
      <span class="chip">Rēzekne · Rīga · Latvija</span>
      <span class="chip">webexpress.lv</span>
    </div>
  </div>
</body></html>
